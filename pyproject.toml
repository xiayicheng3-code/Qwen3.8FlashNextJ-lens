[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen38-jlens"
version = "0.1.0"
description = "Ultra-fast Jacobian Lens (J-lens) fitting engine & Google Colab notebook for Qwen3.8-Flash-Next (qwen4_exp)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "torch>=2.8.0",
    "numpy>=1.26.0",
    "safetensors>=0.4.5",
    "huggingface_hub>=0.26.0",
    "transformers>=5.17.0",
    "psutil>=5.9.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "nbformat>=5.10.0"]
datasets = ["datasets>=3.0.0"]

[tool.setuptools.packages.find]
include = ["qwen38_jlens*"]
